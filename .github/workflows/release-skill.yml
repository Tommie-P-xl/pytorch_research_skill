name: Build and Release Skill

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test updater
        run: python -m unittest discover -s tests -v

      - name: Validate and build Skill ZIP
        run: python tools/build_skill.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned ZIP
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-package
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --repo "$GH_REPO" --clobber
          else
            options=(--generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --repo "$GH_REPO" --verify-tag \
              --title "PyTorch Research Skill $RELEASE_TAG" "${options[@]}"
          fi
